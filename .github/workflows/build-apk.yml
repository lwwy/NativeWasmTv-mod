name: Build nTv APK

# 让你能在 GitHub 网页上点 "Run workflow" 云端打包，无需本地 Android 环境。
# 只打公开的普通三包（ARM32/ARM64/x86），自动跳过需要私有内核的 bro/full 包。

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '要打的架构'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x86
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Choose Gradle tasks
        id: tasks
        run: |
          case "${{ github.event.inputs.abi }}" in
            arm64) echo "value=:app:assembleArm64Debug" >> $GITHUB_OUTPUT ;;
            arm32) echo "value=:app:assembleArm32Debug" >> $GITHUB_OUTPUT ;;
            x86)   echo "value=:app:assembleX86Debug" >> $GITHUB_OUTPUT ;;
            all)   echo "value=:app:assembleArm32Debug :app:assembleArm64Debug :app:assembleX86Debug" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build APK (debug signed, installable)
        # -PwithoutBrowserCore 跳过私有内核；-PapplicationIdOverride 让包名变为 xiao.bu.tv.mod，
        # 与原版 xiao.bu.tv 共存（authority/广播 action 会随包名自动隔离）。
        # debug 用 Android 默认调试签名，可直接安装。
        run: ./gradlew -PwithoutBrowserCore -PapplicationIdOverride=xiao.bu.tv.mod -PversionCodeOverride=24 -PversionNameOverride=1.8.3-mod13 ${{ steps.tasks.outputs.value }} --console=plain --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ntv-apk-${{ github.event.inputs.abi }}
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
